
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planos | Vôo em Libras</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .planos-container {
      max-width: 1100px;
      margin: 45px auto;
      padding: 20px;
      text-align: center;
    }
    .planos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      margin-top: 35px;
    }
    .plano-card {
      background: white;
      border-radius: 16px;
      padding: 28px 22px;
      box-shadow: 0 4px 18px #00000012;
    }
    .plano-card h2 { color: #3157a4; }
    .preco {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }
    .plano-card button {
      background: #3157a4;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 13px 22px;
      cursor: pointer;
      width: 100%;
    }
    .mensagem { padding: 20px; }
  </style>
</head>
<body>
  <main class="planos-container">
    <h1>Escolha seu plano</h1>
    <p>Aprenda Libras no seu ritmo e tenha acesso aos conteúdos da nossa plataforma.</p>

    <div id="mensagem" class="mensagem">Carregando planos...</div>
    <div id="lista-planos" class="planos-grid"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>

  <script>
    const lista = document.getElementById('lista-planos');
    const mensagem = document.getElementById('mensagem');

    function escapar(valor) {
      return String(valor ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[c]);
    }

    function formatarPreco(valor) {
      return Number(valor || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    async function carregarPlanos() {
      const { data, error } = await supabaseClient
        .from('plans')
        .select('id, name, description, price_cents')
        .eq('active', true)
        .order('price_cents', { ascending: true });

      if (error) {
        mensagem.textContent = 'Erro ao carregar planos: ' + error.message;
        return;
      }

      if (!data || data.length === 0) {
        mensagem.textContent = 'Nenhum plano disponível no momento.';
        return;
      }

      mensagem.textContent = '';

      lista.innerHTML = data.map(plano => `
        <article class="plano-card">
          <h2>${escapar(plano.name)}</h2>
          <p>${escapar(plano.description || 'Acesso aos conteúdos da plataforma.')}</p>
          <div class="preco">${formatarPreco(plano.price_cents / 100)}</div>
          <button type="button" onclick="escolherPlano('${escapar(plano.id)}')">
            Escolher este plano
          </button>
        </article>
      `).join('');
    }

   
async function escolherPlano(id) {
  const { data: { user }, error: erroLogin } =
    await supabaseClient.auth.getUser();

  if (erroLogin || !user) {
    alert('Faça login ou crie sua conta para escolher um plano.');
    window.location.href = 'index.html';
    return;
  }

  const { data: plano, error: erroPlano } = await supabaseClient
    .from('plans')
    .select('id, name')
    .eq('id', id)
    .eq('active', true)
    .maybeSingle();

  if (erroPlano || !plano) {
    alert('Não foi possível localizar este plano.');
    return;
  }

  const { error: erroPedido } = await supabaseClient
    .from('plan_requests')
    .insert({
      user_id: user.id,
      plan_id: plano.id,
      status: 'pending'
    });

  if (erroPedido) {
    alert('Erro ao registrar solicitação: ' + erroPedido.message);
    return;
  }

  alert(
    'Solicitação registrada com sucesso!\n\n' +
    'Plano escolhido: ' + plano.name +
    '\n\nAguarde nosso contato com as instruções para pagamento via Pix. ' +
    'O acesso será liberado após a confirmação do pagamento.'
  );
}
