
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrícula | Vôo em Libras</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .planos-container {
      max-width: 1100px;
      margin: 45px auto;
      padding: 20px;
      text-align: center;
    }

    .planos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin-top: 35px;
    }

    .plano-card {
      background: white;
      border-radius: 16px;
      padding: 28px 22px;
      box-shadow: 0 4px 18px #00000012;
    }

    .plano-card h2 { color: #3157a4; }

    .preco {
      font-size: 25px;
      font-weight: bold;
      margin: 12px 0;
    }

    .plano-card button {
      background: #3157a4;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 13px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    .mensagem { padding: 20px; }
    .modalidade { margin-top: 20px; font-weight: bold; }
  </style>
</head>

<body>
  <main class="planos-container">
    <h1>Escolha seu nível de aprendizagem</h1>

    <p>
      Escolha seu nível e sua modalidade de aula presencial.
      Você também terá acesso aos materiais de apoio na área do aluno.
    </p>

    <div id="mensagem" class="mensagem">Carregando níveis...</div>
    <div id="lista-planos" class="planos-grid"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>

  <script>
    const lista = document.getElementById('lista-planos');
    const mensagem = document.getElementById('mensagem');

    function escapar(valor) {
      return String(valor ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[c]);
    }

    function obterPrecos(nome) {
      const nivel = String(nome || '').normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();

      if (nivel.includes('basico')) {
        return { individual: 130, grupo: 95 };
      }

      if (nivel.includes('intermediario')) {
        return { individual: 160, grupo: 110 };
      }

      if (nivel.includes('avancado')) {
        return { individual: 190, grupo: 120 };
      }

      return null;
    }

    function formatarPreco(valor) {
      return Number(valor).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    async function carregarPlanos() {
      const { data, error } = await supabaseClient
        .from('plans')
        .select('id, name, description')
        .eq('active', true)
        .order('name');

      if (error) {
        mensagem.textContent = 'Erro ao carregar níveis: ' + error.message;
        return;
      }

      if (!data || data.length === 0) {
        mensagem.textContent = 'Nenhum nível disponível no momento.';
        return;
      }

      mensagem.textContent = '';

      lista.innerHTML = data.map(plano => {
        const precos = obterPrecos(plano.name);

        if (!precos) {
          return `
            <article class="plano-card">
              <h2>${escapar(plano.name)}</h2>
              <p>Preço ainda não configurado para este nível.</p>
            </article>
          `;
        }

        return `
          <article class="plano-card">
            <h2>${escapar(plano.name)}</h2>

            <p>${escapar(plano.description || 'Curso de Libras com aulas presenciais e materiais de apoio.')}</p>

            <div class="modalidade">Aula individual</div>
            <div class="preco">${formatarPreco(precos.individual)}/mês</div>

            <button type="button"
              onclick="escolherPlano('${escapar(plano.id)}', 'individual')">
              Escolher individual
            </button>

            <div class="modalidade">Aula em grupo</div>
            <div class="preco">${formatarPreco(precos.grupo)}/mês por aluno</div>

            <button type="button"
              onclick="escolherPlano('${escapar(plano.id)}', 'grupo')">
              Escolher em grupo
            </button>
          </article>
        `;
      }).join('');
    }

    async function escolherPlano(id, modalidade) {
      const { data: { user }, error: erroLogin } =
        await supabaseClient.auth.getUser();

      if (erroLogin || !user) {
        alert('Faça login ou crie sua conta para solicitar a matrícula.');
        window.location.href = 'index.html';
        return;
      }

      const { data: plano, error: erroPlano } = await supabaseClient
        .from('plans')
        .select('id, name')
        .eq('id', id)
        .eq('active', true)
        .maybeSingle();

      if (erroPlano || !plano) {
        alert('Não foi possível localizar este nível.');
        return;
      }

      const precos = obterPrecos(plano.name);

      if (!precos) {
        alert('Nível sem preço configurado. Entre em contato conosco.');
        return;
      }

      const valor = precos[modalidade];

      const confirmar = confirm(
        'Confirme sua matrícula:\n\n' +
        'Nível: ' + plano.name + '\n' +
        'Modalidade: ' + (modalidade === 'individual' ? 'Individual' : 'Em grupo') + '\n' +
        'Mensalidade: ' + formatarPreco(valor) +
        '\n\nDeseja enviar a solicitação?'
      );

      if (!confirmar) return;

      const { error: erroPedido } = await supabaseClient
        .from('plan_requests')
        .insert({
          user_id: user.id,
          plan_id: plano.id,
          status: 'pending',
          modalidade: modalidade,
          valor_mensal: valor
        });

      if (erroPedido) {
        alert('Erro ao registrar solicitação: ' + erroPedido.message);
        return;
      }

  mensagem.innerHTML = `
  <div style="
    background: #f3f0ff;
    padding: 25px;
    border-radius: 16px;
    margin-top: 20px;
  ">
    <h2 style="color: #3157a4;">Solicitação registrada!</h2>

    <p><strong>Nível:</strong> ${escapar(plano.name)}</p>
    <p><strong>Modalidade:</strong> ${modalidade === 'individual' ? 'Individual' : 'Em grupo'}</p>
    <p><strong>Mensalidade:</strong> ${formatarPreco(valor)}</p>

    <p>Agora você pode conversar diretamente com a professora Janisley pelo WhatsApp.</p>

    <a
      href="https://wa.me/5544998307145?text=${encodeURIComponent('Olá, Janis! Acabei de solicitar minha matrícula no site Vôo em Libras. Gostaria de conversar sobre as aulas.')}"
      target="_blank"
      rel="noopener noreferrer"
      style="
        display: inline-block;
        background: #25D366;
        color: white;
        padding: 14px 22px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        margin-top: 10px;
      "
    >
      Conversar com a Janis pelo WhatsApp
    </a>
  </div>
`;

lista.innerHTML = '';
    }

    async function iniciarPagina() {
  const { data: { user }, error } = await supabaseClient.auth.getUser();

  if (error || !user) {
    window.location.href = 'login.html?next=planos.html';
    return;
  }

  carregarPlanos();
}

iniciarPagina();
  </script>
</body>
</html>
